# Blueprint de Render: New > Blueprint > elegir este repo. Los valores `sync: false` se cargan a mano en el panel (nunca en Git).
services:
  - type: web
    name: spotcheck
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - { key: NODE_VERSION, value: "22" }
      - { key: NODE_ENV, value: production }
      - { key: TRUST_PROXY, value: "1" }
      - { key: JWT_ACCESS_SECRET, generateValue: true }
      - { key: DB_SSL, value: "true" }
      - { key: OAUTH_APP_REDIRECTS, value: "spotcheck://auth" }
      - { key: MYSQL_URL, sync: false }
      - { key: PUBLIC_BASE_URL, sync: false }
      - { key: RESEND_API_KEY, sync: false }
      - { key: MAIL_FROM, sync: false }
      - { key: GOOGLE_CLIENT_ID, sync: false }
      - { key: GOOGLE_CLIENT_SECRET, sync: false }
      - { key: GITHUB_CLIENT_ID, sync: false }
      - { key: GITHUB_CLIENT_SECRET, sync: false }
      - { key: DISCORD_CLIENT_ID, sync: false }
      - { key: DISCORD_CLIENT_SECRET, sync: false }
